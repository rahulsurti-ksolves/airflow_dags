USER-SUPPLIED VALUES:
apiServer:
  replicas: 2
  service:
    type: LoadBalancer
config:
  logging:
    remote_base_log_folder: s3://airflow-logs
    remote_log_conn_id: minio_s3
    remote_logging: "True"
dags:
  gitSync:
    branch: main
    enabled: true
    repo: https://github.com/rahulsurti-ksolves/airflow_dags.git
    subPath: ""
env:
- name: AIRFLOW_CONN_MINIO_S3
  value: '{"conn_type": "aws", "login": "minioadmin", "password": "minioadmin", "extra":
    {"endpoint_url": "http://minio.airflow.svc.cluster.local:9000", "region_name":
    "us-east-1", "config_kwargs": {"s3": {"addressing_style": "path"}}}}'
executor: KubernetesExecutor
ingress:
  web:
    enabled: true
    hosts: []
scheduler:
  replicas: 2
triggerer:
  replicas: 2
webserver:
  replicas: 2
